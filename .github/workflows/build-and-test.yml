# Builds the full 4-package Harmonic workspace (rmagine, rmagine_gazebo_plugins,
# radarays_gazebo_plugins, radarays_ros) and runs `colcon test` across all
# four -- rmagine's own core/Embree/CUDA/OptiX suite (OptiX is a no-op here,
# see below), rmagine_gazebo_plugins' embree_fixture_* (8: baseline/dynamic/
# pinhole/o1dn/ondn/plane/heightmap/ignore_link), and radarays_gazebo_plugins'
# radarays_fixture_* (static_cpu/dynamic_cpu/dynamic_multi_cpu). This CPU-only
# GitHub-hosted runner has no GPU/CUDA, so rmagine's own CMake auto-skips the
# OptiX build -- there is no GPU/OptiX coverage here at all; that needs a
# self-hosted runner with a real NVIDIA GPU (see build-and-test-gpu.yml and
# MIGRATION_HANDOFF.md, "Phase 2: CI on a real runner").
#
# The actual build+test logic lives in scripts/ci_build_and_test.sh (this
# package) so it's runnable locally too, not just from CI -- see that file
# for the exact steps. That script has been run and verified end-to-end
# locally, both the pass path (52/52 tests) and the fail path (a
# deliberately corrupted fixture threshold was confirmed to make it exit
# non-zero with the right diagnostic, then restored). The GitHub Actions
# provisioning below (exact apt package names, ros-tooling/setup-ros
# version) has NOT been exercised against a live runner -- if something
# here has drifted, that's the first place to look.
name: build-and-test
on:
  push:
    branches: [main, ros2-jazzy-harmonic]
  pull_request:
    branches: [main, ros2-jazzy-harmonic]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout radarays_gazebo_plugins
        uses: actions/checkout@v4
        with:
          path: ws/src/radarays_gazebo_plugins

      - name: Checkout sibling packages
        run: |
          # Clones sibling packages from this workspace's own forks
          # (sotomotocross/*) at ros2-jazzy-harmonic. This is the real,
          # permanent development line now, not a staging step for an
          # upstream PR -- see MIGRATION_HANDOFF.md for why (amock's own
          # rewrite superseded rmagine_gazebo_plugins upstream; we're
          # continuing independently on our forks rather than chasing
          # that merge).
          set -euxo pipefail
          rm -rf ws/src/rmagine
          git clone --depth 1 --branch ros2-jazzy-harmonic https://github.com/sotomotocross/rmagine.git ws/src/rmagine
          rm -rf ws/src/rmagine_gazebo_plugins
          git clone --depth 1 --branch ros2-jazzy-harmonic https://github.com/sotomotocross/rmagine_gazebo_plugins.git ws/src/rmagine_gazebo_plugins
          rm -rf ws/src/radarays_ros
          git clone --depth 1 --branch ros2-jazzy-harmonic https://github.com/sotomotocross/radarays_ros.git ws/src/radarays_ros

      - name: Install ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install Gazebo Harmonic and workspace system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ros-jazzy-ros-gz \
            ros-jazzy-tf2-ros \
            ros-jazzy-cv-bridge \
            ros-jazzy-image-transport \
            libopencv-dev \
            libyaml-cpp-dev \
            libtbb-dev \
            libassimp-dev \
            libeigen3-dev

      - name: rosdep install
        run: |
          set -euxo pipefail
          # ROS 2's setup.bash references variables it doesn't guarantee are
          # set (e.g. AMENT_TRACE_SETUP_FILES) -- not compatible with `set -u`.
          # Found the hard way: this step failed on a real runner with
          # "AMENT_TRACE_SETUP_FILES: unbound variable" the first time this
          # workflow actually ran (see ci_build_and_test.sh, which already had
          # this same fix -- just never applied to this inline step before).
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          cd ws
          rosdep update
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy || true

      - name: Build workspace and run regression fixtures
        run: |
          chmod +x ws/src/radarays_gazebo_plugins/scripts/ci_build_and_test.sh
          ws/src/radarays_gazebo_plugins/scripts/ci_build_and_test.sh
